<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
  <title>AI Watchdog 设置</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #2a2a2a;
      --border: #3c3c3c;
      --text: #e0e0e0;
      --muted: #9a9a9a;
      --accent: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header .logo {
      width: 24px; height: 24px;
      border-radius: 6px;
      background: var(--accent);
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 14px;
    }
    header h1 { font-size: 16px; margin: 0; }
    main { padding: 16px 20px; }
    section { margin-bottom: 24px; }
    section h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin: 0 0 12px;
    }
    .target {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .target-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .target-row input[type=checkbox] {
      width: 16px; height: 16px;
      accent-color: var(--accent);
    }
    .target-name { font-weight: 600; }
    .target-dirs {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      word-break: break-all;
    }
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .form-row label { color: var(--muted); }
    .form-row input[type=number] {
      width: 80px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 8px;
    }
    footer {
      position: sticky;
      bottom: 0;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
    #save {
      background: var(--accent);
      color: #1e1e1e;
      font-weight: 600;
    }
    #save:disabled { opacity: 0.5; cursor: default; }
    #reset { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
    .secondary:disabled { opacity: 0.5; cursor: default; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <span class="logo">A</span>
    <h1>AI Watchdog 设置</h1>
  </header>

  <main>
    <section>
      <h2>监控目标</h2>
      <div id="targets"></div>
    </section>

    <section>
      <h2>灵敏度</h2>
      <div class="form-row">
        <label for="windowSize">滑动窗口（秒）</label>
        <input type="number" id="windowSize" min="1" max="10" />
      </div>
      <div class="form-row">
        <label for="activityThreshold">触发阈值（次变更）</label>
        <input type="number" id="activityThreshold" min="2" max="20" />
      </div>
      <div class="form-row">
        <label for="silenceTimeout">静默超时（秒）</label>
        <input type="number" id="silenceTimeout" min="3" max="60" />
      </div>
      <div class="hint">窗口内文件变更达到阈值判定为「工作中」，静默超过超时判定为「完成」。</div>
    </section>

    <section>
      <h2>关于 / 更新</h2>
      <div class="form-row">
        <span class="target-name">当前版本</span>
        <span id="version">—</span>
      </div>
      <div id="update-status" class="hint"></div>
      <div style="margin-top: 12px; display: flex; gap: 10px;">
        <button id="check-update" class="secondary">检查更新</button>
        <button id="install-update" class="secondary" disabled>重启安装</button>
      </div>
    </section>
  </main>

  <footer>
    <button id="reset">恢复默认</button>
    <button id="save">保存</button>
  </footer>

  <script type="module" src="./settings.js"></script>
</body>
</html>
