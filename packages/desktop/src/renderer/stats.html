<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
  <title>AI Watchdog — 统计</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #2a2a2a;
      --border: #3c3c3c;
      --text: #e0e0e0;
      --muted: #9a9a9a;
      --accent: #f59e0b;
      --done: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 15px; margin: 0; }
    main { padding: 16px 20px; }
    section { margin-bottom: 20px; }
    section h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin: 0 0 10px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .card .label { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .card .value { font-size: 20px; font-weight: 700; }
    .card .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 100px;
      padding-top: 8px;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      height: 100%;
      justify-content: flex-end;
    }
    .bar {
      width: 100%;
      background: var(--accent);
      border-radius: 3px 3px 0 0;
      min-height: 2px;
      transition: height 0.3s;
    }
    .bar-label { font-size: 10px; color: var(--muted); }
    .source-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .source-name { width: 100px; font-size: 12px; }
    .source-bar-bg {
      flex: 1;
      height: 16px;
      background: var(--panel);
      border-radius: 4px;
      overflow: hidden;
    }
    .source-bar {
      height: 100%;
      background: var(--done);
      border-radius: 4px;
    }
    .source-val { width: 80px; text-align: right; font-size: 11px; color: var(--muted); }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px 20px;
      font-size: 13px;
    }
    footer {
      position: sticky;
      bottom: 0;
      padding: 10px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      justify-content: flex-end;
    }
    button {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>统计仪表盘</h1>
    <span id="range" style="color:var(--muted);font-size:11px;"></span>
  </header>
  <main id="content"></main>
  <footer>
    <button id="refresh">刷新</button>
  </footer>
  <script type="module" src="./stats.js"></script>
</body>
</html>
