<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
  <title>AI Watchdog — 通知日志</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #2a2a2a;
      --border: #3c3c3c;
      --text: #e0e0e0;
      --muted: #9a9a9a;
      --accent: #f59e0b;
      --done: #22c55e;
      --waiting: #f59e0b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --panel: #f5f5f5;
        --border: #e0e0e0;
        --text: #1e1e1e;
        --muted: #666666;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 15px; margin: 0; }
    header .count { color: var(--muted); font-size: 12px; }
    main { padding: 12px 20px; }
    .record {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }
    .record .head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .badge.done { background: rgba(34, 197, 94, 0.15); color: var(--done); }
    .badge.waiting { background: rgba(245, 158, 11, 0.15); color: var(--waiting); }
    .record .title { font-weight: 600; flex: 1; }
    .record .time { color: var(--muted); font-size: 11px; }
    .record .body { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 13px;
    }
    footer {
      position: sticky;
      bottom: 0;
      padding: 10px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    button {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
    }
    button.danger { color: #ef4444; }
    button:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>通知日志</h1>
    <span class="count" id="count">0 条</span>
  </header>
  <main id="list"></main>
  <footer>
    <button id="refresh">刷新</button>
    <button id="clear" class="danger">清空</button>
  </footer>
  <script type="module" src="./notifications.js"></script>
</body>
</html>
