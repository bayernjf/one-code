name: CI

# PR 与 main/dev 分支推送时，在 macOS 与 Windows runner 上验证：
# typecheck / unit test / build 全部通过才算 CI 绿。
#
# 覆盖：
#   - @ai-watchdog/core   纯逻辑单测 + 类型检查
#   - @ai-watchdog/desktop 探针/聚合引擎单测 + 类型检查 + 构建
#   - 扩展侧（根）          类型检查 + lint + 构建

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build --workspace @ai-watchdog/core

      - name: Core unit tests
        run: npm test --workspace @ai-watchdog/core

      - name: Core typecheck
        run: npm run typecheck --workspace @ai-watchdog/core

      - name: Desktop unit tests
        run: npm test --workspace @ai-watchdog/desktop

      - name: Desktop typecheck
        run: npm run typecheck --workspace @ai-watchdog/desktop

      - name: Desktop build
        run: npm run build --workspace @ai-watchdog/desktop

      - name: Extension typecheck
        run: npx tsc --noEmit

      - name: Extension lint
        run: npm run lint

      - name: Extension build
        run: npm run build
